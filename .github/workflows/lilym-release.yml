# Lilym Code release: macOS arm64, Windows x64, and Android.
#
# Lilym-only workflow. Upstream's release workflows stay untouched (and disabled
# in this repository's Actions settings), so syncing upstream never conflicts
# here. It calls upstream's build scripts directly; if one of them changes its
# flags, this workflow fails at release time rather than during a rebase.
# See docs/operations/lilym.md.

name: Lilym Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0 (a suffix such as 0.2.0-test.1 publishes a prerelease)"
        required: true
        type: string

concurrency:
  group: lilym-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Matches SEA_NODE_VERSION in apps/server/vite.config.ts.
  SEA_NODE_VERSION: "26.8.2"

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="${DISPATCH_VERSION:-$GITHUB_REF_NAME}"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi
          # Only a plain X.Y.Z becomes the latest release, which is all the
          # stable-channel desktop updater follows.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          else
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # Builds the server, web, and Electron main bundles once for every desktop job.
  bundle:
    name: Build JS bundle
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      # The public T3 Connect identifiers official builds ship with.
      - name: Enable T3 Connect
        run: cp .env.example .env

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      # Two paths under apps/, so consumers download into `apps`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # The Windows desktop embeds this archive as its WSL runtime.
  cli_linux:
    name: Build Linux CLI archive (WSL runtime)
    needs: [prepare, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Enable T3 Connect
        run: cp .env.example .env

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --manifest-path native/resource-monitor/Cargo.toml \
            --target x86_64-unknown-linux-gnu
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$target_dir/"

      - name: Build CLI single-executable
        env:
          VP_NODE_VERSION: ${{ env.SEA_NODE_VERSION }}
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ needs.prepare.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.prepare.outputs.version }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Build ${{ matrix.label }}
    needs: [prepare, bundle, cli_linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macOS arm64
            runner: macos-latest
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          # Upstream measured the Windows package cache as slower than a plain install.
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win' && steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Enable T3 Connect
        shell: bash
        run: cp .env.example .env

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - name: Download Linux CLI archive for WSL
        if: matrix.platform == 'win'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-linux-x64
          path: wsl-runtime

      # Unsigned: macOS builds carry no update feed, Windows builds update from
      # this repository's releases (GITHUB_REPOSITORY).
      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.prepare.outputs.version }}"
            --skip-build
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz)
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-publish
          for file in release/*.dmg release/*.zip release/*.exe release/*.blockmap release/*.yml; do
            # electron-builder's config dump, not an update feed.
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 1

  android:
    name: Build Android APK
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      # The app's OTA URL is upstream's Expo project; Lilym publishes no OTAs,
      # so updates arrive only as new APKs from this repository's releases.
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      T3CODE_MOBILE_VERSION: ${{ needs.prepare.outputs.version }}
      EXPO_NO_GIT_STATUS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LILYM_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LILYM_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LILYM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LILYM_ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret LILYM_ANDROID_${name}. See docs/operations/lilym.md." >&2
              exit 1
            fi
          done

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install mobile dependencies
        run: vp install --filter=@t3tools/mobile...

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Enable T3 Connect
        run: cp .env.example .env

      - name: Generate native Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform android --no-install

      # The app config sets no versionCode, so prebuild writes 1. Derive an
      # increasing one from X.Y.Z so each release installs over the last.
      - name: Set versionCode
        shell: bash
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "${T3CODE_MOBILE_VERSION%%[-+]*}"
          version_code=$(( major * 1000000 + minor * 1000 + patch ))
          sed -i -E "s/versionCode [0-9]+/versionCode ${version_code}/" app/build.gradle
          grep -q "versionCode ${version_code}" app/build.gradle
          echo "versionCode ${version_code}"

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      # Expo's generated project signs release builds with the debug key;
      # replace that signature with Lilym's release key.
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LILYM_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LILYM_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LILYM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LILYM_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/lilym-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p release-android
          output="release-android/Lilym-Code-${T3CODE_MOBILE_VERSION}-android.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$output" \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify --print-certs "$output"
          rm -f "$keystore"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android
          path: release-android/*
          if-no-files-found: error
          retention-days: 1

  # Publishes only after every platform built, so an update manifest never
  # points at a file that is missing from the release.
  publish:
    name: Publish GitHub Release
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "{desktop-*,android}"
          path: release-assets
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --title "Lilym Code v$VERSION"
            --generate-notes
          )
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}" release-assets/*
